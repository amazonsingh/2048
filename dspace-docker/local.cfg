# ===========================================
# DSpace Local Configuration
# ===========================================
# This file overrides default DSpace settings.
# Only settings that differ from defaults need to be specified here.
#
# IMPORTANT: Container hostnames must match docker-compose service names:
#   - Database: dspacedb (not dspace-db)
#   - Solr: dspacesolr (not dspace-solr)
# ===========================================

# DSpace installation directory (inside container)
dspace.dir = /dspace

# ===========================================
# Database Configuration (Supabase)
# ===========================================
# These values are overridden by environment variables in docker-compose.yml
# Keep these as fallback/reference values

# Supabase PostgreSQL connection
# NOTE: Actual values come from .env file via docker-compose
# db.url = jdbc:postgresql://SUPABASE_HOST:PORT/DATABASE?sslmode=require
# db.username = SUPABASE_USER
# db.password = SUPABASE_PASSWORD

db.driver = org.postgresql.Driver
# Note: For DSpace 9/10 with Hibernate 6, use PostgreSQLDialect
db.dialect = org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings for Supabase
db.maxconnections = 30
db.maxwait = 5000
db.maxidle = 10

# ===========================================
# Solr Configuration
# ===========================================
# Solr server using Docker container hostname
solr.server = http://dspacesolr:8983/solr

# ===========================================
# DSpace URLs
# ===========================================
# Backend REST API URL (accessible from outside Docker)
dspace.server.url = http://localhost:8080/server

# Frontend Angular UI URL (accessible from outside Docker)
dspace.ui.url = http://localhost:4000

# ===========================================
# Site Configuration
# ===========================================
dspace.name = DSpace Repository

# Default language
default.language = en_US

# ===========================================
# Email Configuration (disabled by default)
# ===========================================
# Uncomment and configure for production
# mail.server = smtp.example.com
# mail.server.port = 587
# mail.from.address = dspace@example.com
# mail.admin = admin@example.com

# ===========================================
# Handle Configuration (disabled by default)
# ===========================================
# Uncomment and configure for production persistent identifiers
# handle.prefix = 123456789
# handle.canonical.prefix = https://hdl.handle.net/

# ===========================================
# Usage Statistics
# ===========================================
# Required for statistics to work with Solr
# The dbfile path must exist - using temp directory for Docker
usage-statistics.dbfile = /tmp/geolite
